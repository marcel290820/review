name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run check && npm test && npm run build
      # The Rust build embeds frontend/dist, so it must match the source.
      - name: Committed frontend bundle is current
        run: git diff --exit-code -- frontend/dist
      - name: Rust
        run: |
          rustup update stable --no-self-update
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
