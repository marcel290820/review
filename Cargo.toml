[package]
name = "review"
version = "0.1.0"
edition = "2024"
description = "Local file and Git review with portable feedback"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"
rand = "0.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tempfile = "3"
terminal-colorsaurus = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
